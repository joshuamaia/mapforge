<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>MapForge — Visual Data Mapping Studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Estúdio visual de mapeamento de dados que roda inteiramente no navegador." />
    <!--
      connect-src restringe o envio de dados: nenhum script consegue enviar conteúdo para fora da origem.
      ws: é necessário apenas para o recarregamento do ambiente de desenvolvimento.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <mf-root></mf-root>
  </body>
</html>
